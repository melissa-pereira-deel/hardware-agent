name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # A venv, not --system. The runner's /usr is externally managed
      # (PEP 668) and uv refuses it. This also mirrors what `just setup`
      # does locally, so CI exercises the documented path rather than a
      # parallel one that can drift from it.
      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Tests
        run: .venv/bin/python -m pytest -q

      # The README makes four claims beyond "tests pass". Cheaper to prove
      # them than to ask readers to take them on trust.
      - name: Wiki linter passes its own bundled content
        run: .venv/bin/python harness/kb/lint.py wiki-template/wiki

      - name: Risk policy fails closed and refuses the injection case
        run: |
          .venv/bin/python -c "
          from risk_broker.tiers import Policy
          p = Policy()
          assert p.default_tier == 3, 'default_tier must be 3'
          c = p.classify('kicad-cli sch erc b.kicad_sch; rm -rf /tmp/x')
          assert c.blocked == 'unparseable' and c.tier == 3, c
          print(f'{len(p.rules)} rules, default_tier={p.default_tier}, injection refused')
          "

      - name: Skill descriptions route correctly
        run: .venv/bin/python harness/check_skill_routing.py

      - name: Write gate logic
        run: .venv/bin/python harness/kb/check_gate.py
